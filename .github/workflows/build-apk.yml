name: Build APKs (phone + watch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: "npm"

      - name: Use JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK + NDK components (best effort)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          for p in "platform-tools" "platforms;android-37" "platforms;android-37.0" "platforms;android-36" "build-tools;37.0.0" "ndk;27.1.12297006"; do
            echo "=== Installing $p"
            sdkmanager "$p" || echo "Skipping $p (not found); Gradle will fetch it if needed"
          done
          sdkmanager --list_installed

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          GIGYA_API_KEY=${{ secrets.GIGYA_API_KEY }}
          KAMEREON_API_KEY=${{ secrets.KAMEREON_API_KEY }}
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          RTE_BASIC_AUTH=${{ secrets.RTE_BASIC_AUTH }}
          EOF

      - name: Generate debug keystore (gitignored in repo)
        run: |
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore SHA-1:"
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep SHA1

      - name: Install JS dependencies
        run: npm ci

      - name: Build phone + watch APKs
        working-directory: android
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kelec-apks
          retention-days: 1
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/wear/build/outputs/apk/release/*.apk
